version: 2

models:
  - name: stg_people
    description: "Deduplicated list of people currently in orbit, one row per person"
    columns:
      - name: craft
        description: "Name of the spacecraft/station"
        tests:
          - not_null
      - name: name
        description: "Astronaut's name"
        tests:
          - not_null
      - name: _inserted_at
        description: "Timestamp of the latest version of the record"
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - craft
            - name