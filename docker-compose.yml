services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    env_file:
      - .env
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE__USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE__PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE__DB}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--user",
          "${CLICKHOUSE__USER}",
          "--password",
          "${CLICKHOUSE__PASSWORD}",
          "--database",
          "${CLICKHOUSE__DB}",
          "--query",
          "SELECT 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    env_file:
      - .env
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:
  clickhouse_logs: